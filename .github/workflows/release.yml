name: Build PocketGB Windows Release

on:
  push:
    branches:
      - pocketgb-emulator
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out PocketGB and emulator source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Apply PocketGB branding and UI
        shell: pwsh
        run: .\scripts\Prepare.ps1

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish .\vendor\GameboySharp\GameboySharp.csproj --configuration Release --runtime win-x64 --self-contained true -p:AssemblyName=PocketGB -p:Version=1.0.1 -p:DebugType=none -p:DebugSymbols=false --output .\publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="1.0.1" /DPublishDir="..\publish" .\install\PocketGB.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path .\publish\* -DestinationPath .\dist\PocketGB-Portable-1.0.1.zip -CompressionLevel Optimal

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: PocketGB-Windows-x64
          path: |
            dist/PocketGB-Setup-1.0.1.exe
            dist/PocketGB-Portable-1.0.1.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: PocketGB-Windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocketgb-v1.0.1
          target_commitish: pocketgb-emulator
          name: PocketGB v1.0.1
          body: |
            First PocketGB Windows release.

            - Self-contained Windows x64 installer
            - Portable ZIP
            - Game Boy and Game Boy Color support
            - 10 save-state slots per game
            - Automatic battery-backed saves
            - ZIP archive ROM detection and extraction
            - Responsive two-row toolbar and dialogs

            Bring your own legally obtained ROM files.
          draft: false
          prerelease: false
          files: |
            dist/PocketGB-Setup-1.0.1.exe
            dist/PocketGB-Portable-1.0.1.zip
