name: PocketGB Android APK

on:
  push:
    branches:
      - main
      - pocketgb-android
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PocketGB source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned mGBA core
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: 431935616c0e216d650b25b2ea0c0acccd359038
          path: third_party/mgba

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and native toolchain
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Compile mGBA core for Android arm64
        shell: bash
        run: bash ./scripts/build-mgba-android.sh

      - name: Publish Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          dotnet publish android/PocketGB.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -o publish/android
          APK="$(find publish/android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist/android
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            KEYSTORE="$RUNNER_TEMP/pocketgb-release.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            KEYSTORE="$RUNNER_TEMP/pocketgb-oneoff.keystore"
            STORE_PASS="PocketGB-OneOff-2026"
            KEY_ALIAS="pocketgb"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=PocketGB Android Release"
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" dist/android/PocketGB-Android-arm64-1.4.0.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            dist/android/PocketGB-Android-arm64-1.4.0.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/android/PocketGB-Android-arm64-1.4.0.apk
          sha256sum dist/android/PocketGB-Android-arm64-1.4.0.apk > dist/android/SHA256-ANDROID.txt
          ls -lh dist/android

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: PocketGB-Android-arm64
          path: |
            dist/android/PocketGB-Android-arm64-1.4.0.apk
            dist/android/SHA256-ANDROID.txt
          if-no-files-found: error
          retention-days: 30
      - name: Wait for the matching Windows v1.4.0 release
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: PocketGB v1.4.0') }}"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/pocketgb-v1.4.0"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$API" >/dev/null; then
              echo "PocketGB v1.4.0 release exists; uploading Android APK."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the Windows release workflow." >&2
          exit 1

      - name: Attach Android APK to PocketGB v1.4.0 release
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: PocketGB v1.4.0') }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocketgb-v1.4.0
          files: |
            dist/android/PocketGB-Android-arm64-1.4.0.apk
            dist/android/SHA256-ANDROID.txt

