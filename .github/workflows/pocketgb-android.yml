name: PocketGB Android APK

on:
  push:
    branches:
      - main
      - pocketgb-android
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PocketGB source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned mGBA core
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: 431935616c0e216d650b25b2ea0c0acccd359038
          path: third_party/mgba

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and native toolchain
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Compile mGBA core for Android arm64
        shell: bash
        run: bash ./scripts/build-mgba-android.sh

      - name: Publish Android APK
        shell: bash
        run: |
          dotnet publish android/PocketGB.Android.csproj \
            -c Release \
            -f net9.0-android \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -o publish/android
          APK="$(find publish/android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist/android
          KEYSTORE="$RUNNER_TEMP/pocketgb-oneoff.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "PocketGB-OneOff-2026" \
            -alias pocketgb -keypass "PocketGB-OneOff-2026" -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=PocketGB Android Release"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" dist/android/PocketGB-Android-arm64.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias pocketgb \
            --ks-pass pass:PocketGB-OneOff-2026 --key-pass pass:PocketGB-OneOff-2026 \
            dist/android/PocketGB-Android-arm64.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/android/PocketGB-Android-arm64.apk
          sha256sum dist/android/PocketGB-Android-arm64.apk > dist/android/SHA256-ANDROID.txt
          ls -lh dist/android

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: PocketGB-Android-arm64
          path: |
            dist/android/PocketGB-Android-arm64.apk
            dist/android/SHA256-ANDROID.txt
          if-no-files-found: error
          retention-days: 30
