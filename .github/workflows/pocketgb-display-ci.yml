name: PocketGB Windows Build and Installer CI

on:
  push:
    branches:
      - pocketgb-display-settings
  pull_request:
    branches:
      - pocketgb-emulator
      - pocketgb-display-settings

permissions:
  contents: read

jobs:
  build-test-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout PocketGB and pinned core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Prepare PocketGB source
        shell: pwsh
        run: ./scripts/Prepare.ps1

      - name: Run tests
        env:
          GBSHARP_AUDIO: none
        shell: pwsh
        run: dotnet test ./vendor/GameboySharp/GameboySharp.sln -c Release

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish ./vendor/GameboySharp/GameboySharp.csproj -c Release -r win-x64 --self-contained true -p:AssemblyName=PocketGB -p:Version=1.2.0 -p:PublishReadyToRun=true -p:TieredPGO=true -p:DebugType=none -p:DebugSymbols=false -o ./publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }
          if (-not (Test-Path ./publish/PocketGB.exe)) { throw "PocketGB.exe missing." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./dist | Out-Null
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler /DAppVersion="1.2.0" /DPublishDir="..\publish" ./install/PocketGB.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path ./dist/PocketGB-Setup-1.2.0.exe)) { throw "Installer missing." }
          Compress-Archive -Path ./publish/* -DestinationPath ./dist/PocketGB-Portable-1.2.0.zip -CompressionLevel Optimal
          Get-ChildItem ./dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content ./dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows installer, portable build and checksums
        uses: actions/upload-artifact@v4
        with:
          name: PocketGB-Windows-x64
          path: |
            dist/PocketGB-Setup-1.2.0.exe
            dist/PocketGB-Portable-1.2.0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
