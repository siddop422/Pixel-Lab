name: PocketGB Windows Build and Installer CI

on:
  push:
    branches:
      - main
      - pocketgb-accuracy-diagnostics
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout PocketGB and pinned core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned mGBA core source (MPL-2.0)
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: 431935616c0e216d650b25b2ea0c0acccd359038
          path: third_party/mgba

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Prepare PocketGB source
        shell: pwsh
        run: ./scripts/Prepare.ps1

      - name: Build core-only mGBA native adapter
        shell: pwsh
        run: ./scripts/Build-Mgba.ps1

      - name: Run tests
        env:
          GBSHARP_AUDIO: none
          PGB_MGBA_NATIVE_DLL: ${{ github.workspace }}/artifacts/native/win-x64/pocketgb-mgba.dll
        shell: pwsh
        run: dotnet test ./vendor/GameboySharp/GameboySharp.sln -c Release

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish ./vendor/GameboySharp/GameboySharp.csproj -c Release -r win-x64 --self-contained true -p:AssemblyName=PocketGB -p:Version=1.4.0 -p:PublishReadyToRun=false -p:TieredPGO=true -p:DebugType=none -p:DebugSymbols=false -o ./publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }
          if (-not (Test-Path ./publish/PocketGB.exe)) { throw "PocketGB.exe missing." }

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $compiler) {
            Write-Host "Using preinstalled Inno Setup compiler: $compiler"
          } else {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./dist | Out-Null
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler /DAppVersion="1.4.0" /DPublishDir="..\publish" ./install/PocketGB.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path ./dist/PocketGB-Setup-1.4.0.exe)) { throw "Installer missing." }
          Compress-Archive -Path ./publish/* -DestinationPath ./dist/PocketGB-Portable-1.4.0.zip -CompressionLevel Optimal
          Get-ChildItem ./dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content ./dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows installer, portable build and checksums
        uses: actions/upload-artifact@v4
        with:
          name: PocketGB-Windows-x64
          path: |
            dist/PocketGB-Setup-1.4.0.exe
            dist/PocketGB-Portable-1.4.0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish official PocketGB v1.4.0 GitHub Release
        if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: PocketGB v1.4.0') }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocketgb-v1.4.0
          target_commitish: main
          name: PocketGB v1.4.0
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/PocketGB-Setup-1.4.0.exe
            dist/PocketGB-Portable-1.4.0.zip
            dist/SHA256SUMS.txt
          body: |
            PocketGB 1.4.0 — Windows and Android release.

            Downloads:
            - **PocketGB-Setup-1.4.0.exe** — self-contained per-user installer. It keeps the existing PocketGB application ID and install location so installing 1.4.0 upgrades the existing 1.2.0 install.
            - **PocketGB-Portable-1.4.0.zip** — self-contained portable Windows build.
            - **SHA256SUMS.txt** — SHA-256 checksums for Windows downloads.
            - **PocketGB-Android-arm64-1.4.0.apk** — Android 6.0+ arm64-v8a APK; attached by the Android workflow.
            - **SHA256-ANDROID.txt** — SHA-256 checksum for the Android APK.

            Display and graphics:
            - Custom window dimensions, fullscreen, V-Sync, nearest/bilinear/sharp-bilinear scaling.
            - LCD grid, scanlines, CRT vignette/curvature, brightness and saturation controls.
            - Low-end profile to disable optional effects.
            - OpenGL 3.3 is the only implemented graphics API. Audio backend options are Auto, SDL and OpenAL.
            - Temporal frame blending is an experimental visual blend, not motion-vector frame generation or FPS doubling.

            Compatibility:
            - Native mGBA core for Game Boy Advance, Game Boy and Game Boy Color; Auto prefers mGBA for .gba/.gb/.gbc/.sgb.
            - GameboySharp remains selectable as a manual GB/GBC fallback with its existing save-state and debugger tools.
            - mGBA supports a broad set of common and uncommon GBA/GB cartridge types, but compatibility is not guaranteed for every game, mapper, peripheral or ROM hack.
            - Special GameboySharp ROM-size header codes 0x52, 0x53 and 0x54 remain handled.

            Android: fullscreen landscape touch controls, Android document picker, native mGBA GB/GBC/GBA core, AudioTrack output, save states, battery saves, pause/reset and speed/turbo. The first APK supports arm64-v8a phones/tablets only; x86_64 Android emulators and 32-bit-only devices are not included.

            Automated tests, the self-contained Windows publish, Inno Setup compilation and Android APK build/signature verification must pass before v1.4.0 is considered complete. The installer is not Authenticode-signed; use the checksums to verify file integrity and download only from this official GitHub release.
